<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>رباح - الواجهة الحية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: #050a14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 30px 16px;
  }

  /* خلفية متحركة */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 20% 20%, #0f2b4d 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #2a0f1d 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0a1a2e 0%, #02060d 100%);
    animation: bgMove 20s ease-in-out infinite alternate;
    z-index: -2;
  }

  @keyframes bgMove {
    0% { transform: translate(0,0); }
    100% { transform: translate(-5%,-5%); }
  }

  /* شبكة البطاقات */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    max-width: 400px;
    width: 100%;
    margin-bottom: 50px;
    z-index: 1;
  }

  /* البطاقة - مع طفو ونبض */
  .card {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1.05;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-decoration: none;
    color: #fff;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    animation: float 6s ease-in-out infinite;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
  }

  /* كل بطاقة تطفو بتوقيت مختلف */
  .card:nth-child(1) { animation-delay: 0s; }
  .card:nth-child(2) { animation-delay: -1.5s; }
  .card:nth-child(3) { animation-delay: -3s; }
  .card:nth-child(4) { animation-delay: -4.5s; }
